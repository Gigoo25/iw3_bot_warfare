// Local Bot Warfare test server. Loaded via +exec server.cfg.
set sv_hostname "Bot Warfare Dev"
set sv_maxclients 18
set g_gametype "war"
set sv_maprotation "gametype war map mp_crash gametype war map mp_backlot gametype dom map mp_strike gametype sd map mp_crossfire"
set scr_war_timelimit 10
set scr_war_scorelimit 0

// rcon for tools/rcon.py (local only; server is not public)
set rcon_password "botdev123"

// Bot Warfare
set bots_manage_add 12
set bots_manage_fill 12
set bots_manage_fill_mode 0
set bots_skill 0
set bots_main_debug 0
set bots_telemetry 1
